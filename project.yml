name: OutApp
options:
  bundleIdPrefix: com.example.out      # ggf. eigenen Präfix eintragen
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""               # in Xcode unter "Signing & Capabilities" wählen
    CODE_SIGN_STYLE: Automatic
targets:
  Out:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: OutWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.out
        PRODUCT_NAME: Out
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Out
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Das Mikrofon wird benötigt, um die gesagte Zahl zu erkennen."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Die Spracherkennung wandelt die gesagte Zahl in das Ergebnis um."
  OutWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.out.watchkitapp
        PRODUCT_NAME: Out
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Out
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.out
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        SKIP_INSTALL: YES
